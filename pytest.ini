[pytest]
# Coverage is measured on every run, here rather than in the Makefile or the
# workflow, so `make test`, `make coverage` and CI all report and gate the
# same way. A number that only
# CI computes is one nobody sees until it is too late to act on.
#
# The settings, the 100% floor (lines and branches) and what is measured live
# in .coveragerc, which `--cov` with no value defers to, so pytest-cov, the
# spawned interpreters and `coverage report` all read the same ones. A run of
# part of the suite, one file or `-k`, reports under 100 and fails for that
# reason alone; run the whole suite before reading anything into it.
addopts = --cov --cov-report=term-missing
testpaths = tests
