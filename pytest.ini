[pytest]
# Coverage is measured on every run, here rather than in the Makefile or the
# workflow, so `make test`, CI and a bare `python3 -m pytest` in L2 all
# report and gate the same way. A number that only
# CI computes is one nobody sees until it is too late to act on.
#
# --cov-fail-under=90 against a measured 94: a floor with room for ordinary
# churn, not a ratchet. It is there to catch a real regression, code added
# with no test reaching it, rather than to punish a refactor that moves a few
# lines around. Raise it deliberately if the real number climbs; do not lower
# it to make a red run green.
#
# src/ only. tests/ and tools/ are not the thing under test, and counting them
# inflates the figure with code that is executed by definition.
addopts = --cov=src --cov-report=term-missing --cov-fail-under=90
testpaths = tests
