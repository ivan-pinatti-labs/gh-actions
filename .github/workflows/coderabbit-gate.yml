---
name: CodeRabbit Gate

# This repository's own gate, calling the reusable workflow it publishes.
#
# Called by relative path rather than by SHA, which is the one case where that
# is correct: a repository calling its own reusable workflow gets the copy from
# the commit that triggered the run, so a change to the gate is graded by the
# changed gate rather than by the last released one. Consumers pin a SHA.
#
# Which commit that is depends on the trigger, and one of them matters. On
# `pull_request_target` it is the base branch. Under `merge_group` it is the
# queue's temporary commit, which contains the pull request's changes, so the
# reusable workflow refuses to read its grading library from there and falls
# back to the default branch; see the "Resolve the ref to read the library
# from" step. Without that, code under test would be running in a job holding
# `statuses: write`.

on:
  # dangerous-triggers is ignored on each trigger line below, which is where
  # zizmor reports it from 1.31 on; an ignore up here no longer reaches it.
  #
  # Never checks out the pull request. The reusable workflow pins its checkout
  # to the default branch, and the only things read from the pull request are
  # its number, its metadata and its diff, all as data fetched through the API.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  status:
  # CodeRabbit reports a review as a check run since late October 2026.
  check_run:
    types: [completed]
  schedule:
    # :11, offset from every sibling repository's hourly sweep so this
    # organization's gates do not land on the same Actions minute. Taken:
    # rsync-crypt and .github at :47, devcontainer-airlock and github-template
    # at :53, pre-commit-checklists at :41, pre-commit-checklists-demo at :31,
    # docker-torrent-box-with-vpn at :47.
    - cron: "11 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: >-
          Pull request number to re-grade. Blank re-grades every open pull
          request.
        required: false
        type: string
  merge_group:

permissions:
  contents: read

jobs:
  gate:
    # zizmor wants the $/ self-repository form; actionlint, pinned through
    # pre-commit-checklists, rejects it, so ./ stays until it accepts it.
    uses: ./.github/workflows/reusable-coderabbit-gate.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    with:
      pr_number: ${{ github.event.inputs.pr_number }}
