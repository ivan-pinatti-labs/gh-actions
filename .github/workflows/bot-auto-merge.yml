---
name: Bot Auto Merge

# This repository's own bot lane, calling the reusable workflow it publishes.
#
# Called by relative path, the same reasoning as coderabbit-gate.yml: a change
# to the lane is graded by the changed lane rather than by the last released
# one. Consumers pin a SHA.

on:
  # zizmor: ignore[dangerous-triggers]
  #
  # Never checks out the pull request. The reusable workflow pins its checkout
  # to the default branch and reads the pull request only as API data.
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
  # The gate publishes `Pin Only` and `Review Verified`, and SonarQube Cloud's
  # analysis can finish after it, so the lane wakes when either finishes
  # rather than polling from the start.
  workflow_run:
    workflows: ["CodeRabbit Gate", "SonarQube"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: >-
          Re-check one stranded bot pull request. Blank checks every open one.
        required: false
        type: string

permissions:
  contents: read

jobs:
  bot-auto-merge:
    # zizmor wants the $/ self-repository form; actionlint, pinned through
    # pre-commit-checklists, rejects it, so ./ stays until it accepts it.
    uses: ./.github/workflows/reusable-bot-auto-merge.yml # zizmor: ignore[self-repository]
    # `contents: write` because the called `approve-bot` job asks for it, to
    # arm `gh pr merge --auto`. A called workflow may lower the permissions it
    # is handed but never raise them, so granting less here does not degrade
    # gracefully: GitHub refuses the whole run before any job starts, and both
    # lanes stop. The inline job this replaced had it for the same reason.
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    with:
      owner_login: ${{ vars.REPO_OWNER_LOGIN }}
      bots: "renovate[bot]"
      pr_number: ${{ github.event.inputs.pr_number }}
      # This repository publishes `Tests` and `SonarQube` as well, required
      # like the other three. `Tests` is the check that proves the shared
      # library still grades every consumer the way their own script did, and
      # `SonarQube` is the quality gate, so the owner lane waits on both too.
      # The reusable workflow's default stays at the three every consumer has.
      required_contexts: "Pre-commit,Tests,SonarQube,Pin Only,Review Verified"
