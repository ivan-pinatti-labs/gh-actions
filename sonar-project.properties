# SonarQube Cloud analysis settings, read by .github/workflows/sonarqube.yml.
# The project is analyzed from CI with Automatic Analysis turned off in the
# project settings: the two cannot run side by side, and a CI scan aborts
# while Automatic Analysis is on.
sonar.organization=ivan-pinatti-labs
sonar.projectKey=ivan-pinatti-labs_gh-actions
sonar.projectName=gh-actions

# Sources are the whole tree rather than a list of folders, so a new file is
# analyzed without anyone remembering to add it here. Sonar only reads the
# languages it has an analyzer for (Python, shell, the L2 Dockerfile, YAML and
# GitHub Actions here) plus its secrets detection, which runs over every text
# file. tests/ is analyzed as test code, which Sonar holds to a different rule
# set, so it is excluded from sources to keep the two disjoint.
# .secrets.baseline is generated by detect-secrets and only records hashes.
# coverage/ holds the reports `make coverage` writes just before the scan.
sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,.secrets.baseline,coverage/**
sonar.test.inclusions=tests/**

# tests/originals/ holds the consumers' previous scripts, fetched verbatim by
# tools/fetch-originals.sh for the equivalence suite and gitignored. They are
# frozen third party copies nobody may edit, so findings on them could never
# be acted on. tests/fixtures/ holds diffs that are deliberately malformed or
# hostile inputs (a smuggled command, a changed action owner).
sonar.test.exclusions=tests/originals/**,tests/fixtures/**

# tools/coverage_subprocess/sitecustomize.py starts coverage inside the
# interpreters the tests spawn, before any measurement exists, so it can never
# measure itself. .coveragerc omits it for the same reason; this keeps
# SonarQube Cloud from counting it as 0% covered source. It is still analyzed.
sonar.coverage.exclusions=tools/coverage_subprocess/**

# The interpreter the Tests job and this analysis both run, so rules that
# depend on the language version judge the code against the one it actually
# runs on.
sonar.python.version=3.14

# Written by `make coverage` (sonarqube.yml's "Measure coverage" step), never
# committed. shell.xml is kcov's report of every shell script outside tests/
# (the Makefile's SHELL_SCRIPTS, found rather than listed), in
# SonarQube's generic coverage format, since SonarQube has no shell coverage
# importer. The bash inline in .github/workflows/ has no report: it only runs
# inside GitHub Actions, where nothing can measure it.
sonar.python.coverage.reportPaths=coverage/coverage.xml
sonar.coverageReportPaths=coverage/shell.xml

sonar.sourceEncoding=UTF-8
