# Reproduces pre-commit-checklists' scripts/assert-pin-only-diff.py exactly.
allowed_paths:
  - .pre-commit-config.yaml
  - checklists/
  - .github/workflows/
  - .devcontainer/Dockerfile

arg_sources:
  - file: .devcontainer/Dockerfile
    annotations:
      - '^#\s*renovate:'

rules:
  - path: .devcontainer/Dockerfile
    grammars: [image_digest, arg_pin]
  - path: .github/workflows/
    grammars:
      - {name: action_sha, when: outside_block_scalar}
      - {name: bare_action_version, when: outside_block_scalar}
      - {name: rev_pin, when: outside_block_scalar}

default_grammars: [action_sha, bare_action_version, rev_pin]
