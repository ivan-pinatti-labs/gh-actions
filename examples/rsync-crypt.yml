# Reproduces rsync-crypt's scripts/assert-pin-only-diff.py exactly.
allowed_paths:
  - Dockerfile
  - .pre-commit-config.yaml
  - .github/workflows/
  - .devcontainer/Dockerfile

arg_sources:
  - file: Dockerfile
    annotations:
      - '^#\s*renovate:'
      - '^#\s*apk-pin:\s*resolved-from=ALPINE_VERSION\s*$'

rules:
  - path: Dockerfile
    grammars: [annotated_arg]
  - path: .devcontainer/Dockerfile
    grammars: [image_digest]
  - path: .github/workflows/
    grammars:
      - name: action_sha
        when: outside_block_scalar
      - name: bare_action_version
        when: outside_block_scalar
      - name: rev_pin
        when: outside_block_scalar

default_grammars: [action_sha, bare_action_version, rev_pin]
