# Reproduces docker-torrent-box-with-vpn's scripts/assert-pin-only-diff.py.
# Its block scalar exemption is scoped to .github/workflows/, like every other
# repository, but unlike them it keeps the digest and version grammars running
# inside those block scalars and skips only the action ones.
allowed_paths:
  - .env.example
  - .pre-commit-config.yaml
  - .github/workflows/
  - tests/requirements.txt

rules:
  - path: .github/workflows/
    grammars:
      - digest_strip
      - name: action_sha_strip
        when: outside_block_scalar
      - name: bare_action_version_strip
        when: outside_block_scalar
      - name: action_ref_version
        when: outside_block_scalar
      - version

default_grammars:
  - digest_strip
  - action_sha_strip
  - bare_action_version_strip
  - action_ref_version
  - version
